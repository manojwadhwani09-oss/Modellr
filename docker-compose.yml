services:
  modellr:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1024x1536}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-low}
    restart: unless-stopped
