services:
  - type: web
    name: modellr
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_IMAGE_SIZE
        value: 1024x1536
      - key: OPENAI_IMAGE_QUALITY
        value: high
